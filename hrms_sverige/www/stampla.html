{% extends "templates/base.html" %}
{% block title %}Stämpling{% endblock %}
{# Terminalsida: utan webbplatsens meny och sidfot #}
{% block navbar %}{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
<style>
	/* Färger, typsnitt och knappar kommer från webbtemat (Website Theme) via Frappes variabler och .btn-klasser */
	/* width: 100 %, annars krymper rutan till knapparnas minsta bredd i webbplatsens layout */
	.st { width: 100%; max-width: 440px; box-sizing: border-box; margin: 6vh auto; padding: 16px; text-align: center; color: var(--text-color); }
	.st h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
	.st p { color: var(--text-muted); }
	.st .falt { font-size: 2rem; letter-spacing: 0.3rem; min-height: 3rem; border-bottom: 2px solid var(--border-color); margin: 1rem 0; }
	.st .knappar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
	/* Höjden sätts med min-height: Frappes .btn-padding har högre specificitet och ger för små tryckytor */
	.st .btn { display: flex; align-items: center; justify-content: center; min-height: 4.5rem; font-size: 1.8rem; border-radius: var(--border-radius-lg, 12px); touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent; }
	.st .btn.stor { grid-column: span 3; min-height: 5rem; }
	.st .btn.andra { grid-column: span 3; min-height: 3.5rem; font-size: 1.1rem; }
	.st .fel { color: var(--alert-text-danger); min-height: 1.5rem; }
</style>
<div class="st">
	<h1 id="rubrik">Stämpling</h1>
	<p id="text"></p>
	<div class="falt" id="falt"></div>
	<div class="fel" id="fel"></div>
	<div id="yta"></div>
</div>
{% endblock %}
